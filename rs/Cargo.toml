[package]
name = "ivo"
publish = true
description = "The rust implementation of the ivo schema valitator"
categories.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license-file.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true
rust-version.workspace = true

[workspace]
members = ["crates/*", "examples/*"]
resolver = "2"

[workspace.package]
version = "0.0.2"
edition = "2021"
authors = ["kamtoeddy <lollipopkalog@gmail.com>"]
categories = ["data-structures", "development-tools"]
license-file = "../LICENSE"
readme = "../README.md"
repository = "https://github.com/kamtoeddy/ivo/rs"
homepage = "https://github.com/kamtoeddy/ivo/rs"
keywords = ["ivo", "schema", "validation", "data-modelling"]
rust-version = "1.80.0"

[workspace.dependencies]
# core deps
futures-locks = "0.7"

# examples & tests deps
async-std = { version= "1.13.2", features = ["attributes"] }
chrono = "0.4.45"
regex = "1.10"
unicode-normalization = "0.1"

[features]
validators = ["dep:ivo-validators"]

[dependencies]
futures = "0.3"
futures-locks.workspace = true
ivo-derive = { path = "./crates/derive", version = "0.0.2" }
ivo-validators = { path = "./crates/validators", version = "0.0.2", optional = true}

[dev-dependencies]
chrono.workspace = true
regex.workspace = true
unicode-normalization.workspace = true

async-std.workspace = true
smol = "2.0.2"
tokio = { version = "1.0", features = ["rt", "macros"] }
paste = "1.0.15"
seahash = "4.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "users_demo"
path = "examples/users_demo/src/main.rs"
required-features = ["validators"]

[[example]]
name = "constant_computed"
path = "examples/constant_with_computed_value.rs"

[[example]]
name = "constant_static"
path = "examples/constant_with_static_value.rs"

[[example]]
name = "dependent_with_dynamic_default"
path = "examples/dependent_with_dynamic_default.rs"

[[example]]
name = "dependent_with_static_default"
path = "examples/dependent_with_static_default.rs"

[[example]]
name = "dependent_with_readonly"
path = "examples/dependent_with_readonly.rs"

[[example]]
name = "lax_with_dynamic_default"
path = "examples/lax_with_dynamic_default.rs"

[[example]]
name = "lax_with_static_default"
path = "examples/lax_with_static_default.rs"

[[example]]
name = "lax_with_validators"
path = "examples/lax_with_validators.rs"

[[example]]
name = "required"
path = "examples/required.rs"

[[example]]
name = "required_error"
path = "examples/required_error.rs"

[[example]]
name = "required_ignore_update"
path = "examples/required_ignore_update.rs"

[[example]]
name = "required_re_validate"
path = "examples/required_re_validate.rs"

[[example]]
name = "timestamps_with_custom_names"
path = "examples/timestamps_with_custom_names.rs"

[[example]]
name = "timestamps_with_custom_names_and_optional_updated_at"
path = "examples/timestamps_with_custom_names_and_optional_updated_at.rs"

[[example]]
name = "timestamps_with_default_names"
path = "examples/timestamps_with_default_names.rs"

[[example]]
name = "timestamps_with_default_names_and_optional_updated_at"
path = "examples/timestamps_with_default_names_and_optional_updated_at.rs"
