
[package]
name = "ivo"
license-file = "../../../LICENSE"
publish = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The schema valitator that brings user stories to life, inspired by ivo on npm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
validators = ["dep:ivo-validators"]

[dependencies]
futures = "0.3"
futures-locks = "0.7"
ivo-derive = { path = "../ivo-derive", version = "0.0.2" }
ivo-validators = { path = "../ivo-validators", version = "0.0.2", optional = true}

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
async-std = { version= "1.13.2", features = ["attributes"] }
smol = "2.0.2"
paste = "1.0"
