[package]
name = "ivo"
version = "0.0.1"
edition = "2021"
description = "The schema valitator that brings user stories to life, inspired by ivo on npm"
license-file = "../LICENSE"
keywords = ["schema", "validation"]
homepage = "https://github.com/kamtoeddy/ivo#readme"
repository = "https://github.com/kamtoeddy/ivo.git"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
ivo_struct = { path = "./lib/ivo_struct" }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
unicode-normalization = "0.1"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
