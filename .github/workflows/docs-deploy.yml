name: Docs Deploy

on:
  pull_request:
    paths:
      - "docs/**"
      - "ts/src/**"
      - "ts/tests/**"
      - "ts/docs/**"
      - "rs/**"
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "ts/src/**"
      - "ts/tests/**"
      - "ts/docs/**"
      - "rs/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs

    steps:
      - uses: actions/checkout@v6

      - name: Use Bun.js
        uses: oven-sh/setup-bun@v2
        with:
          version: 1.x

      - name: Use Rust stable (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 📦 Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: 📦 Install dependencies
        run: bun install

      - name: 🔄 Import TS docs (ts/docs/v1.9.0 -> ts_versioned_docs/)
        run: node scripts/import-ts-docs.mjs

      - name: 🦀 Build Rust playground WASM
        run: bash scripts/build-rust-wasm.sh

      - name: ⚒️ Build site
        run: bun run build

      - name: ⭐ Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: ✅ Run E2E tests
        run: bun run test:e2e

      # Requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID repo secrets and a
      # Cloudflare Pages project named "ivo-docs" - see /docs/TODO.md Phase 7 for
      # the (external, user-only) setup steps. PRs build-check only; only pushes
      # to main deploy.
      - name: 🚀 Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ivo-docs
          directory: docs/build
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
