name: Docs E2E

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'ts/src/**'
      - 'ts/tests/**'
      - 'rs/**'
  push:
    branches: ['main']
    paths:
      - 'docs/**'
      - 'ts/src/**'
      - 'ts/tests/**'
      - 'rs/**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs

    steps:
      - uses: actions/checkout@v6

      - name: Use Bun.js
        uses: oven-sh/setup-bun@v2
        with:
          version: 1.x

      - name: Use Rust stable (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: 📦 Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: 📦 Install dependencies
        run: bun install

      - name: 🔄 Import TS docs (ts/docs/v1.9.0 -> ts_versioned_docs/)
        run: node scripts/import-ts-docs.mjs

      - name: 🦀 Build Rust playground WASM
        run: bash scripts/build-rust-wasm.sh

      - name: ⚒️ Build site
        run: bun run build

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run E2E tests
        run: bun run test:e2e
