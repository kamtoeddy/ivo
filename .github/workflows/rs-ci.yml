name: Rust CI

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "rs/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rs
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo ci

  test-nightly:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rs
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo ci
