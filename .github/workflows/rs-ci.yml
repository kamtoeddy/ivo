name: Rust CI

on:
  pull_request:
  push:
    branches: ["main", "rust"]
    paths:
      - "./rs/*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cd ./rs && cargo test

  test-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - run: cd ./rs && cargo test
